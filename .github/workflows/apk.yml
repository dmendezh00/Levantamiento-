name: Construir APK

# Cada cambio en la app (index.html) genera una APK nueva en "Releases".
on:
  push:
    branches: [main]
    paths: ['index.html', 'apk/**', '.github/workflows/apk.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apk
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install --no-audit --no-fund

      - name: Copiar la app (con el mapa incluido, para abrir sin internet)
        run: |
          mkdir -p www/lib
          cp ../index.html www/index.html
          cp node_modules/leaflet/dist/leaflet.css node_modules/leaflet/dist/leaflet.js \
             node_modules/leaflet-rotate/dist/leaflet-rotate-src.js node_modules/jszip/dist/jszip.min.js www/lib/
          cp -r node_modules/leaflet/dist/images www/lib/
          sed -i \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css#lib/leaflet.css#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js#lib/leaflet.js#' \
            -e 's#https://cdn.jsdelivr.net/npm/leaflet-rotate@0.2.8/dist/leaflet-rotate-src.js#lib/leaflet-rotate-src.js#' \
            -e 's#https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js#lib/jszip.min.js#' \
            www/index.html
          echo "Librerías externas que quedan:"; grep -oE 'src="https?://[^"]+"' www/index.html || echo "ninguna"

      - name: Crear proyecto Android
        run: npx cap add android

      - name: Permisos y versión
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" android:maxSdkVersion="29" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />\n    <uses-feature android:name="android.hardware.location.gps" android:required="false" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />\n</manifest>#' $M
          # respaldo automático en Documentos (Android 10 necesita esto)
          sed -i 's#<application #<application android:requestLegacyExternalStorage="true" #' $M
          G=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/; s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" $G
          grep -E "versionCode|versionName" $G
          cat $M

      - name: Ícono y pantalla de inicio
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Sincronizar
        run: npx cap sync android

      - name: Llave de firma fija (para poder actualizar sin desinstalar)
        run: |
          mkdir -p ~/.android && cp debug.keystore ~/.android/debug.keystore
          cat >> android/app/build.gradle <<'GRADLE'

          // Firma siempre con apk/debug.keystore: Android solo deja actualizar si la llave es la misma.
          android {
              signingConfigs {
                  fija {
                      storeFile file("../../debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.fija }
              }
          }
          GRADLE

      - name: Compilar APK
        working-directory: apk/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Nombrar APK y comprobar la firma
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ../Levantamiento-MT.apk
          ESPERADA=$(keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep 'SHA256:' | awk '{print $2}')
          REAL=$(keytool -printcert -jarfile ../Levantamiento-MT.apk | grep 'SHA256:' | head -1 | awk '{print $2}')
          echo "Esperada: $ESPERADA"; echo "APK:      $REAL"
          [ "$ESPERADA" = "$REAL" ] || { echo "La APK no quedó firmada con la llave fija"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: Levantamiento-MT-apk
          path: Levantamiento-MT.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-v${{ github.run_number }}
          name: Levantamiento MT 1.${{ github.run_number }}
          make_latest: true
          body: |
            Descarga **Levantamiento-MT.apk** desde el celular e instálala.
            Si ya tienes una versión anterior, se actualiza sin perder tus levantamientos.
          files: Levantamiento-MT.apk
